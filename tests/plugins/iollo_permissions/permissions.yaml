# Iollo permission tiers (brief 031, docs/PERMISSIONS.md). One policy for the box and the Mac, enforced by the
# same Hermes code (the fork's iollo-permissions plugin). The tier sections are both Jev's rubric (rendered as a
# <tier-rubric> block) and the keyword detectors used only when Jev is unavailable. Tier 4 is code and runs
# first. Regexes are Python syntax, matched case-insensitively. Changing this file changes box settings: bump
# POLICY_VERSION in profile_policy.py.
version: 1
workspace: {box: /workspace, mac: null}      # the Mac supplies its own path (Mac brief 029)
write_roots: {box: [], mac: [Documents, Desktop, Downloads]}   # defaults, relative to home; the Mac adds the owner's choices
# Tier-1 roots besides the workspace where Hermes tools legitimately create and delete files (media, memory notes,
# skills, state). Writing and permanently deleting there is tier 1: there is no trash to move to. /root/work is the
# box's real workspace (/workspace links to it); $HERMES_HOME is the profile's own directory.
scratch_roots: {box: [/tmp, /root/work, $HERMES_HOME], mac: []}
versioning: {enabled: true, keep_days: 30}
delete: trash                                  # where a trash exists (workspace, write roots); scratch roots delete permanently
tier1_notify: [send_message, email_send, form_submit, booking, calendar_invite, accept_terms]

tier1:
  describe: >-
    Everything not listed under tier 3 or tier 4 runs without asking: reading anything reachable; browsing,
    searching, booking and comparing; writing and editing in the workspace and the allowed write roots (every
    write is versioned, a delete moves to the Trash); creating and deleting files in the scratch roots (temporary
    files, the assistant's own notes, skills and state); drafting messages and emails, and sending them after the
    owner's OK in chat; acting on the web for the owner; filling an already saved login into its own site;
    scheduled and background work.

tier3:
  pay:
    describe: >-
      Spending money or entering payment details: typing a card number, CVC or CVV, expiry, IBAN or sort code,
      or pressing a pay, place order, buy now, complete purchase, confirm and pay, subscribe or checkout control
      on a page that shows an amount of money.
    # the box's browser tools, then the Mac's computer_* equivalents
    tools: [browser_type, browser_click, computer_type, computer_click]
    fields:
      - 'card.?num|cc.?num|cc-number|credit.?card|debit.?card'
      - '\bcvc\b|\bcvv\b|\bcvc2\b|cc-csc|security.?code|card.?verification'
      - 'expir|\bexp\b|cc-exp|valid.?thru|\bmm.?/.?yy\b'
      - '\biban\b'
      - 'sort.?code'
    buttons:
      - '\bpay\b'
      - 'place.?order'
      - 'buy.?now'
      - 'complete.?purchase'
      - 'confirm.?(and|&).?pay'
      - '\bsubscribe\b'
      - 'check.?out'
    currency: '[€$£¥]\s?\d|\d[\d.,]*\s?(€|£|\$|eur|usd|gbp|chf|brl)\b'
  delete:
    describe: >-
      Permanent deletion (rm, unlink, shred, find -delete, emptying the Trash) of a path inside a write root but
      outside the workspace, or one action touching more than bulk_threshold files there.
    bulk_threshold: 20
    commands:
      - '(^|[;&|(\s])(rm|unlink|shred)\s'
      - '\bfind\b.*\s-delete\b'
    empty_trash: 'empty.?(the.?)?trash|rm\s.*\.trash\b'
  system:
    describe: >-
      Changing system or security settings (security defaults, network, launch daemons, profiles, power,
      Privacy & Security), writing to ~/.ssh, .env or the keychain folder, or saving, revealing, changing or
      exporting a password or key, including typing into a password field. Filling an already saved login into
      its own site (browser_vault_fill) is tier 1.
    commands:
      - '\bdefaults\s+(-currenthost\s+)?write\s+\S*(security|alf|firewall|screensaver|loginwindow|gatekeeper|softwareupdate|timemachine)'
      - '\bnetworksetup\b'
      - '\bscutil\b'
      - '\blaunchctl\s+(load|unload|bootstrap|bootout|enable|disable|kickstart|remove|submit)\b(?!.*\b(gui|user)/)'
      - '(^|[;&|]\s*)profiles\s'
      - '\bpmset\b'
      - 'x-apple\.systempreferences:com\.apple\.(preference\.security|settings\.privacysecurity)'
    paths: ["~/.ssh/", ".env", "~/Library/Keychains/"]
    tools: [browser_vault_save_login]
    password_fields: 'password|passwd|\bpwd\b|passcode'
  bulk_new:
    describe: >-
      One send to at least `recipients` addresses, or that many sends inside `window_minutes`, where one address
      is new: never messaged by this Iollo and not in the owner's contacts.
    recipients: 5
    window_minutes: 10

tier4:
  describe: >-
    Refused even if the owner asks: destructive file-system commands outside the workspace, the scratch roots and the write roots;
    disk-level operations; disabling security; exporting the keychain; sudo.
  commands:
    - '(^|[;&|(\s])dd\s+(.*\s)?(if|of)='
    - '\bmkfs(\.\w+)?\b'
    - '\bdiskutil\s+(erase\w*|partition\w*|apfs\s+delete\w*|zerodisk|secureerase|reformat)'
    - '\bcsrutil\s+(disable|clear|authenticated-root\s+disable)'
    - '\bspctl\s+(--master-disable|--global-disable)'
    - '\bfdesetup\s+disable\b'
    - '\btccutil\s+reset\b'
    - '\bsecurity\s+(export|dump-keychain|find-(generic|internet)-password\b.*\s-w\b)'
    - '(^|[;&|(\s])sudo\s'
  # copied into approvals.deny, so the fork's floor refuses these before any mode (fnmatch, lower case)
  deny_globs:
    - 'sudo *'
    - '* sudo *'
    - 'dd if=*'
    - '*mkfs*'
    - '*diskutil erase*'
    - '*diskutil partition*'
    - '*diskutil apfs delete*'
    - '*csrutil disable*'
    - '*spctl --master-disable*'
    - '*fdesetup disable*'
    - '*tccutil reset*'
    - '*security dump-keychain*'
    - '*security export*'
    - 'rm -rf /'
    - 'rm -rf /etc*'
    - 'rm -rf /usr*'
    - 'rm -rf /bin*'
    - 'rm -rf /sbin*'
    - 'rm -rf /var*'
    - 'rm -rf /system*'
    - 'rm -rf /library*'
    - 'rm -rf ~'
    - 'rm -rf ~/'
